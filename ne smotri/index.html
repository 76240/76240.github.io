<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>▶</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #111;
  }

  #btn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    max-width: 100vw;
    max-height: 100vh;
    cursor: pointer;
    z-index: 10;
    user-select: none;
    -webkit-user-drag: none;
    display: block;
  }
  #btn.hidden { display: none; }


  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    pointer-events: none;
    display: none;
  }
  #bg.show { display: block; }
</style>
</head>
<body>

  <img id="btn" src="button.png" alt="Enter">
  <img id="bg" src="bg.gif" alt="">
  <audio id="song" src="song.mp3" preload="auto" loop></audio>

  <script>
    const btn  = document.getElementById('btn');
    const bg   = document.getElementById('bg');
    const song = document.getElementById('song');

    btn.addEventListener('click', async () => {

      btn.classList.add('hidden');


      bg.classList.add('show');


      song.volume = 1;
      try {
        await song.play();
      } catch (e) {
        console.warn('Не удалось воспроизвести:', e);
      }


      try {
        await document.documentElement.requestFullscreen();
      } catch (e) {}
    });
  </script>
</body>
</html>
